  return l.length?`<h3>${t('daily')}</h3><div class="tw"><table><thead><tr><th>${t('date')}</th><th>${t('branch')}</th><th>${t('orders')}</th><th>${t('gross')}</th><th>${t('disc')}</th><th>Payout</th><th>${t('net')}</th><th>VAT</th>${cfg.pms.map(p=>`<th>${esc(p.n)}</th>`).join('')}${cfg.svs.map(p=>`<th>${esc(p.n)}</th>`).join('')}</tr></thead><tbody>${l.map(y=>`<tr><td>${y.date}</td><td>${BR(y.branch)}</td><td>${y.orders}</td>${c(y.gross)}${c(y.disc)}${c(y.payout)}${c(y.net)}${c(y.vat)}${cfg.pms.map(p=>c(pv(y)[p.id])).join('')}${cfg.svs.map(p=>c((y.sv||{})[p.id])).join('')}</tr>`).join('')}</tbody><tfoot><tr><td>${t('total')}</td><td></td><td>${x.o}</td>${c(x.g)}${c(x.d)}${c(x.p)}${c(x.net)}${c(x.v)}${cfg.pms.map(p=>c(x.pm[p.id])).join('')}${cfg.svs.map(p=>c(x.sv[p.id])).join('')}</tr></tfoot></table></div>`:''};
  const bars=(arr,tot)=>arr.map(p=>{const v=tot[p.id]||0;return `<div class="bar"><span>${esc(p.n)}</span><i style="width:${x.g?Math.min(100,Math.max(v/x.g*100,v?1:0)):0}%"></i><b>${f3(v)}</b></div>`}).join('');
  const k=(b,s)=>`<div><b>${b}</b><span>${s}</span></div>`;
  $('#rp').innerHTML=`<div class="kpi">${k(x.n,t('days'))}${k(x.o,t('orders'))}${k(f3(x.g),t('gross'))}${k(f3(x.d),t('disc'))}${k(f3(x.p),'Payout')}${k(f3(x.net),t('net'))}${k(f3(x.v),'VAT')}${k(x.n?f3(x.g/x.n):'–',t('avg'))}${k(bd?f3(bd[1])+' ('+bd[0].slice(8)+')':'–',t('best'))}${k(ch==null?'–':(ch>0?'+':'')+ch.toFixed(1)+'%',t('vsP'))}</div>
  <h3>${t('chartT')}</h3>${chart(l,S.m)}<h3>${t('sPay')}</h3>${bars(cfg.pms,x.pm)}<h3>${t('sSvc')}</h3>${bars(cfg.svs,x.sv)}${miss()}${det(l,x)}`;
 };
 $('#fm').onchange=$('#fb').onchange=draw;draw();
 const save=async(fn,data)=>{try{await dl({filename:fn,data})}catch(e){if(!e||e.code!=='declined')toast(t('xf'))}};
 const nm=()=>`wazzup-${S.b}-${S.m}`;
 $('#xr').onclick=()=>{try{window.print()}catch(e){toast(t('xf'))}};
 $('#xx').onclick=()=>{getF();const l=pick(S.m,S.b),hd=['Date','Branch','Time','Cashier','Orders','Avg Order','Gross','Discounts','Payout','Net','VAT',...cfg.pms.map(p=>p.n),...cfg.svs.map(p=>p.n)];
  const rows=l.map(x=>[x.date,BE[x.branch],x.ts?hm(x.ts):'',x.cashier||'',x.orders,x.orders?+(x.gross/x.orders).toFixed(3):0,x.gross,x.disc,x.payout,x.net,x.vat,...cfg.pms.map(p=>((x.pn||x.pm)||{})[p.id]||0),...cfg.svs.map(p=>(x.sv||{})[p.id]||0)]);
  const x=agg(l);rows.push(['Total','','','',x.o,x.o?+(x.g/x.o).toFixed(3):0,x.g,x.d,x.p,x.net,x.v,...cfg.pms.map(p=>x.pm[p.id]||0),...cfg.svs.map(p=>x.sv[p.id]||0)]);
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([hd,...rows]),'Sales');XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([['Month',S.m],['Days',x.n],['Orders',x.o],['Gross',x.g],['Discounts',x.d],['Payout',x.p],['Net',x.net],['VAT',x.v],[],...cfg.pms.map(p=>[p.n,x.pm[p.id]||0]),[],...cfg.svs.map(p=>[p.n,x.sv[p.id]||0])]),'Summary');save(nm()+'.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}))};
 $('#xp').onclick=()=>{getF();const l=pick(S.m,S.b),x=agg(l),doc=new window.jspdf.jsPDF({orientation:'landscape'}),pv=y=>y.pn||y.pm||{},sty={fontSize:8,cellPadding:1.6},hs={fillColor:[232,89,12]},fs={fillColor:[60,60,60]},sm=(o,k)=>k.reduce((a,p)=>a+(o[p.id]||0),0);
  doc.setFontSize(15);doc.text(cfg.name+' - Monthly Sales Report',14,14);doc.setFontSize(10);doc.text(S.m+'  |  '+(S.b==='all'?'All branches':BE[S.b])+'  |  Days: '+x.n,14,20);
  const tb=(title,head,body,foot)=>{const y0=doc.lastAutoTable?doc.lastAutoTable.finalY+9:27;doc.setFontSize(11);doc.text(title,14,y0);doc.autoTable({startY:y0+2,head:[head],body,foot:[foot],styles:sty,headStyles:hs,footStyles:fs,showFoot:'lastPage'})};
  tb('Summary',['Date','Branch','Orders','Avg Order','Gross','Discounts','Payout','Net','VAT'],l.map(y=>[y.date,BE[y.branch],y.orders,f3(y.orders?y.gross/y.orders:0),f3(y.gross),f3(y.disc),f3(y.payout),f3(y.net),f3(y.vat)]),['Total','',x.o,f3(x.o?x.g/x.o:0),f3(x.g),f3(x.d),f3(x.p),f3(x.net),f3(x.v)]);
  tb('Payment methods',['Date','Branch',...cfg.pms.map(p=>p.n),'Total'],l.map(y=>[y.date,BE[y.branch],...cfg.pms.map(p=>f3(pv(y)[p.id])),f3(sm(pv(y),cfg.pms))]),['Total','',...cfg.pms.map(p=>f3(x.pm[p.id])),f3(sm(x.pm,cfg.pms))]);
  tb('Services',['Date','Branch',...cfg.svs.map(p=>p.n),'Total'],l.map(y=>[y.date,BE[y.branch],...cfg.svs.map(p=>f3((y.sv||{})[p.id])),f3(sm(y.sv||{},cfg.svs))]),['Total','',...cfg.svs.map(p=>f3(x.sv[p.id])),f3(sm(x.sv,cfg.svs))]);
  save(nm()+'.pdf',doc.output('arraybuffer'))};
}
function settingsView(){
 const lst=(k,tt)=>`<h3>${tt}</h3>${cfg[k].map((p,i)=>`<div class="row"><input data-l="${k}" data-i="${i}" value="${esc(p.n)}">${k==='pms'?`<label style="flex-direction:row;align-items:center"><input type="checkbox" data-dl="${i}" ${p.dl?'checked':''}> ${t('sDl')}</label><label style="flex-direction:row;align-items:center"><input type="checkbox" data-dd="${i}" ${p.dd?'checked':''}> ${t('sDd')}</label>`:''}<button class="s d" data-del="${k}:${i}">✕</button></div>`).join('')}<button class="s g" data-add="${k}">${t('add')}</button>`;
 $('#tab').innerHTML=`<div class="card"><h2>${t('tSet')}</h2>
 <div class="grid"><label>${t('sName')}<input id="sn" value="${esc(cfg.name)}"></label><label>${t('sCol')}<input type="color" id="sc" value="${esc(cfg.color)}"></label><label>${t('sLogo')}<input type="file" id="sl" accept="image/*"></label><label>${t('sVat')}<input type="number" id="sv" step="0.1" min="0" value="${cfg.vat}"></label><label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="sp" ${cfg.mr!==false?'checked':''}> ${t('sPa')}</label></div>
 <h3>🔐 ${t('sPwF')}</h3>
 ${lst('pms',t('sPm'))}${lst('svs',t('sSv'))}
 <div class="msg" id="sm"></div><div class="row"><button id="ss">${t('sSave')}</button></div></div><div class="card"><h2>${t('safe')}</h2><div class="row"><button class="g" id="bk">${t('bk')}</button><label class="btn g" style="flex-direction:row;cursor:pointer;color:var(--tx)">${t('rst')}<input type="file" id="rf" accept=".json" hidden></label><button class="g" id="tr">${t('trash')}</button></div><div id="tl"></div></div>`;
 const grab=()=>{document.querySelectorAll('[data-l]').forEach(i=>{const p=cfg[i.dataset.l][i.dataset.i];p.n=i.value.trim()||p.n});document.querySelectorAll('[data-dl]').forEach(i=>cfg.pms[i.dataset.dl].dl=i.checked);document.querySelectorAll('[data-dd]').forEach(i=>cfg.pms[i.dataset.dd].dd=i.checked)};
 document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{grab();cfg[b.dataset.add].push({id:'x'+Date.now().toString(36),n:t('nw'),dl:false});settingsView()});
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!await ask(t('cHide')))return;grab();const[k,i]=b.dataset.del.split(':');cfg[k].splice(+i,1);settingsView()});
 $('#sl').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,160/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cfg.logo=c.toDataURL('image/png');toast('✓ '+t('sLogo'))};im.src=URL.createObjectURL(f)};
 $('#bk').onclick=async()=>{const c=Object.assign({},cfg);delete c.h;try{await dl({filename:'wazzup-backup-'+today()+'.json',data:JSON.stringify({config:c,sales},null,1)})}catch(e){}};
 $('#rf').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text()),k=Object.keys(j.sales||{});if(!k.length||!await ask(t('rstQ')+' '+k.length))return;for(const id of k)await col.doc(id).set(j.sales[id]);toast(t('saved'))}catch(x){toast(t('fail'))}};
 $('#tr').onclick=async()=>{const q=await db.collection('trash').get(),l=q.docs.map(d=>Object.assign({id:d.id},d.data()));$('#tl').innerHTML=l.length?l.map(y=>`<div class="row"><span>${y.date} · ${BR(y.branch)} · ${f3(y.net)}</span><button class="s g" data-rt="${y.id}">${t('restore')}</button></div>`).join(''):`<p>${t('noRec')}</p>`;
  document.querySelectorAll('[data-rt]').forEach(b=>b.onclick=async()=>{const y=l.find(z=>z.id===b.dataset.rt),rec=Object.assign({},y);delete rec.id;delete rec.delAt;const key=rec.key;delete rec.key;await col.doc(key).set(rec);await db.collection('trash').doc(y.id).delete();sales[key]=rec;toast(t('saved'));$('#tr').click()})};
 $('#ss').onclick=async()=>{grab();const m=$('#sm'),er=x=>{m.className='msg er';m.textContent=x};
  delete cfg.h;cfg.name=$('#sn').value.trim()||'Wazzup Dog';cfg.color=$('#sc').value;cfg.vat=N($('#sv').value);cfg.mr=$('#sp').checked;
  try{await cfgRef.set(cfg);theme$();toast(t('saved'));shell()}catch(e){er(t('fail'))}};
}
init();
